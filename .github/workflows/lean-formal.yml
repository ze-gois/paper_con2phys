name: Formal Lean
on:
  push:
    branches: [main, feat/lean-formal-inventory-pilot]
    paths: ["formal/lean/**", "books/formal_foundations/**", "mathematics/**", ".github/workflows/lean-formal.yml"]
  pull_request:
    paths: ["formal/lean/**", "books/formal_foundations/**", "mathematics/**", ".github/workflows/lean-formal.yml"]
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit English mathematics and Lean links
        run: |
          python3 mathematics/audit_formal.py --write
          python3 mathematics/audit_formal.py --check
      - name: Install elan using the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and download proof cache
        working-directory: formal/lean
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check Lean project
        working-directory: formal/lean
        run: |
          lake build
          lake env lean Con2physFormal/Logic.lean
      - name: Export and validate direct proof dependency graph
        working-directory: formal/lean
        run: |
          lake env lean Con2physFormal/DependencyGraph.lean
          python3 tools/dependency_graph.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-inventory
          path: mathematics/formal_inventory.json

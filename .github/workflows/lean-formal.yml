name: Formal Lean
on:
  push:
    branches: [main, feat/lean-formal-inventory-pilot]
    paths: ["formal/lean/**", "books/formal_foundations/**", "mathematics/**", ".github/workflows/lean-formal.yml"]
  pull_request:
    paths: ["formal/lean/**", "books/formal_foundations/**", "mathematics/**", ".github/workflows/lean-formal.yml"]
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Audit English mathematics and Lean links
        run: |
          python3 mathematics/audit_formal.py --write
          python3 mathematics/audit_formal.py --check
      - name: Lean build and kernel check
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
      - name: Print axiomatic dependencies
        working-directory: formal/lean
        run: lake env lean Con2physFormal/Logic.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-inventory
          path: mathematics/formal_inventory.json
